version: "3.7"

services:
  dns-funny:
    build: .
    container_name: dns-funny
    restart: always
    ports:
      # Expose your custom DNS port to the public internet
      - "5353:5353/udp"
    networks:
      # Attach to the external Caddy network
      - caddy_net
    volumes:
      # Persist your SQLite database file on the host machine
      - ./sovereignty.db:/app/sovereignty.db

networks:
  caddy_net:
    # Crucial: Tells Docker that this network already exists 
    # and was created by your caddy-docker stack
    external: true
