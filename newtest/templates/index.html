<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sovereignty Sentinel | Digital Independence Dashboard</title>
    
    <!-- CSS Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        #map {
            height: 100%;
            width: 100%;
            background: #050505;
        }
        
        .glass {
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .neon-text {
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }
        
        .neon-border {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
            border: 1px solid rgba(34, 211, 238, 0.3);
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        .leaflet-container { background: #050505 !important; }
    </style>
</head>

<body class="h-screen w-screen flex flex-col">

    <!-- Header -->
    <header class="h-16 flex items-center justify-between px-6 border-b border-white/10 glass z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center pulse">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tighter neon-text">SOVEREIGNTY<span class="text-cyan-400">SENTINEL</span></h1>
                <p class="text-[10px] uppercase tracking-widest text-white/40 font-bold">Network Autonomy Monitor v1.0</p>
            </div>
        </div>
        
        <div class="flex gap-8">
            <div class="text-right">
                <p class="text-[10px] text-white/40 uppercase font-bold">Total Requests</p>
                <p id="stat-total" class="text-xl font-bold mono text-cyan-400">0</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-white/40 uppercase font-bold">US Dependence</p>
                <p id="stat-us-dep" class="text-xl font-bold mono text-rose-500">0%</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-white/40 uppercase font-bold">Global Reach</p>
                <p id="stat-countries" class="text-xl font-bold mono text-emerald-400">0</p>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Left Sidebar: Live Log -->
        <aside class="w-80 border-r border-white/10 glass flex flex-col z-40">
            <div class="p-4 border-b border-white/10 flex justify-between items-center">
                <h2 class="text-xs font-bold uppercase tracking-widest text-white/60">Live Intercepts</h2>
                <span class="flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
            </div>
            <div id="log" class="flex-1 overflow-y-auto p-4 space-y-3 mono text-[11px]">
                <!-- Log entries go here -->
                <div class="text-white/30 italic text-center py-10">Awaiting DNS traffic...</div>
            </div>
        </aside>

        <!-- Center: Map -->
        <section class="flex-1 relative bg-[#050505]">
            <div id="map"></div>
            
            <!-- Map Overlay UI -->
            <div class="absolute bottom-6 left-6 right-6 flex gap-4 z-[1000]">
                <div class="glass p-4 rounded-xl flex-1 neon-border">
                    <h3 class="text-[10px] uppercase font-bold text-white/50 mb-3 tracking-widest">Infrastructure Distribution</h3>
                    <div class="h-24 flex items-end gap-2" id="provider-bars">
                        <!-- Bars dynamically added here -->
                    </div>
                </div>
                
                <div class="glass p-4 rounded-xl w-64 neon-border">
                    <h3 class="text-[10px] uppercase font-bold text-white/50 mb-3 tracking-widest">Jurisdiction Warning</h3>
                    <div id="warning-box" class="text-xs text-white/70 leading-relaxed">
                        No critical dependencies detected yet. All systems nominal.
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- JS Libs -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // --- Initialization ---
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([20, 0], 2);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        const socket = io();
        const logDiv = document.getElementById("log");
        
        // Stats state
        let stats = {
            total: 0,
            usDependent: 0,
            countries: new Set(),
            providers: {}
        };

        // --- UI Update Helpers ---
        function updateStats() {
            document.getElementById("stat-total").textContent = stats.total;
            document.getElementById("stat-countries").textContent = stats.countries.size;
            
            const usPercent = stats.total > 0 ? Math.round((stats.usDependent / stats.total) * 100) : 0;
            document.getElementById("stat-us-dep").textContent = `${usPercent}%`;
            
            if (usPercent > 50) {
                document.getElementById("warning-box").innerHTML = `<span class="text-rose-400 font-bold">CRITICAL DEPENDENCE:</span> Over 50% of your traffic is under US Cloud Act jurisdiction. Data sovereignty is compromised.`;
            } else if (usPercent > 20) {
                document.getElementById("warning-box").innerHTML = `<span class="text-amber-400 font-bold">MODERATE RISK:</span> Significant infrastructure is centralized in US-controlled nodes.`;
            }

            renderProviderBars();
        }

        function renderProviderBars() {
            const container = document.getElementById("provider-bars");
            container.innerHTML = "";
            
            const sorted = Object.entries(stats.providers).sort((a,b) => b[1] - a[1]).slice(0, 5);
            const max = Math.max(...Object.values(stats.providers), 1);

            sorted.forEach(([name, count]) => {
                const height = (count / max) * 100;
                const bar = document.createElement("div");
                bar.className = "flex-1 flex flex-col items-center gap-1";
                bar.innerHTML = `
                    <div class="w-full bg-cyan-500/20 rounded-t relative group" style="height: ${height}%">
                        <div class="absolute inset-0 bg-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="absolute -top-4 left-0 right-0 text-[8px] text-center mono">${count}</div>
                    </div>
                    <div class="text-[8px] uppercase truncate w-full text-center text-white/40">${name.split(' ')[0]}</div>
                `;
                container.appendChild(bar);
            });
        }

        function addLogEntry(data) {
            if (stats.total === 1) logDiv.innerHTML = ""; // Clear placeholder
            
            const el = document.createElement("div");
            el.className = "p-2 border-l-2 border-cyan-500 bg-white/5 rounded-r hover:bg-white/10 transition-colors";
            
            const isUs = data.true_sovereignty.includes("United States");
            const borderCol = isUs ? "border-rose-500" : "border-emerald-500";
            el.style.borderLeftColor = isUs ? "#f43f5e" : "#10b981";

            el.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <span class="text-cyan-400 font-bold truncate pr-2">${data.domain}</span>
                    <span class="text-[9px] text-white/30">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="flex justify-between text-[9px] text-white/50 uppercase font-bold">
                    <span>${data.country_code} // ${data.provider_group}</span>
                </div>
            `;
            
            logDiv.prepend(el);
            if (logDiv.children.length > 50) logDiv.lastChild.remove();
        }

        function plotOnMap(data) {
            if (!data.lat || !data.lon) return;

            const isUs = data.true_sovereignty.includes("United States");
            const color = isUs ? "#f43f5e" : "#10b981";
            
            const marker = L.circleMarker([data.lat, data.lon], {
                radius: 5,
                fillColor: color,
                color: "#fff",
                weight: 1,
                opacity: 0.5,
                fillOpacity: 0.8
            }).addTo(map);

            marker.bindPopup(`
                <div class="mono text-[10px] p-1">
                    <b class="text-cyan-600">${data.domain}</b><br>
                    IP: ${data.ip}<br>
                    ASN: ${data.asn_owner}<br>
                    SOVEREIGNTY: <span style="color:${color}">${data.true_sovereignty}</span>
                </div>
            `);

            // Pulse effect
            const pulse = L.circleMarker([data.lat, data.lon], {
                radius: 5,
                fillColor: color,
                color: color,
                weight: 2,
                opacity: 0.8,
                fillOpacity: 0
            }).addTo(map);

            let r = 5;
            const interval = setInterval(() => {
                r += 2;
                pulse.setRadius(r);
                pulse.setStyle({ opacity: 1 - (r/30) });
                if (r > 30) {
                    clearInterval(interval);
                    map.removeLayer(pulse);
                }
            }, 30);
        }

        // --- Socket Events ---
        socket.on("dns_event", (data) => {
            console.log("DNS EVENT:", data);
            
            // Update Stats
            stats.total++;
            if (data.true_sovereignty.includes("United States")) stats.usDependent++;
            stats.countries.add(data.country);
            
            const pg = data.provider_group || "Unknown";
            stats.providers[pg] = (stats.providers[pg] || 0) + 1;

            updateStats();
            addLogEntry(data);
            plotOnMap(data);
        });

        socket.on("connect", () => console.log("SENTINEL ONLINE"));
        socket.on("connect_error", (e) => console.error("CONNECTION INTERRUPTED", e));

    </script>
</body>
</html>
