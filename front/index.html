<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sovereignty Sentinel | Digital Independence Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        #map {
            height: 100%;
            width: 100%;
            background: #050505;
        }

        .glass {
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neon-border {
            border: 1px solid rgba(34, 211, 238, 0.2);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.05);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        .leaflet-container { background: #050505 !important; }

        .country-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        .country-progress {
            height: 100%;
            background: #22d3ee;
            transition: width 0.5s ease-out;
        }

        .sidebar-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="h-screen w-screen flex flex-col">

<header class="h-16 flex items-center justify-between px-6 border-b border-white/10 glass z-50">
    <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center">
            <img src="static/bobrNet.png" alt="bobrNet logo" />
        </div>
        <div>
            <h1 class="text-xl font-bold tracking-tighter">bobrNet</h1>
        </div>
        <button onclick="collapseSidebar('info-panel')" class="ml-6 text-white/40 hover:text-cyan-400 transition-colors" title="Toggle Left Panel">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
    </div>
    <div>
        <button onclick="collapseSidebar('right-panel')" class="text-white/40 hover:text-cyan-400 transition-colors" title="Toggle Right Panel">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg>
        </button>
    </div>
</header>

<main class="flex-1 flex overflow-hidden relative">

    <aside id="info-panel" class="w-72 border-r border-white/10 glass flex flex-col z-40 sidebar-transition">
        <div class="p-4 border-b border-white/10">
            <h3 class="text-[10px] uppercase font-bold text-white/40 mb-2 tracking-widest">Network Stats</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="p-4 bg-white/5 rounded-lg border border-white/10">
                    <p class="text-[10px] text-white/40 uppercase font-bold mb-1">Total Requests</p>
                    <p id="stat-total" class="text-2xl font-bold mono text-cyan-400">0</p>
                </div>
                <div class="p-4 bg-white/5 rounded-lg border border-white/10">
                    <p class="text-[10px] text-white/40 uppercase font-bold mb-1">Countries Hit</p>
                    <p id="stat-countries" class="text-2xl font-bold mono text-emerald-400">0</p>
                </div>
            </div>
        </div>

        <div class="p-4 border-b border-white/10">
            <h3 class="text-[10px] uppercase font-bold text-white/40 mb-4 tracking-widest">Country Dependencies</h3>
            <div id="country-ranking-right" class="space-y-4">
                <div class="text-white/20 text-[10px] italic text-center py-4">No data collected</div>
            </div>
        </div>

        <div class="p-4 border-b border-white/10">
            <h3 class="text-[10px] uppercase font-bold text-white/40 mb-6 tracking-widest">Provider Distribution</h3>
            <div class="flex items-end gap-2 h-[200px] overflow-hidden pt-4" id="provider-bars">
            </div>
        </div>
    </aside>

    <section class="flex-1 relative bg-[#050505]">
        <div id="map"></div>
    </section>

    <aside id="right-panel" class="w-80 border-l border-white/10 glass flex flex-col z-40 sidebar-transition overflow-y-auto custom-scrollbar">
        <div class="flex items-center gap-2 mx-4 mt-4">
            <h2 class="text-white/60">Intercepted Network Traffic</h2>
            <span id="live-indicator" class="flex h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
        </div>

        <div class="relative mt-2 mx-4">
            <input type="text" id="filter-input" placeholder="Search domain..." class="w-full bg-white/5 border border-white/10 rounded-lg py-2 pl-9 pr-3 text-[11px] focus:outline-none focus:border-cyan-500/50 transition-colors">
            <svg class="w-3.5 h-3.5 absolute left-3 top-2.5 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        </div>

        <div id="log" class="flex-1 overflow-y-auto p-4 space-y-3 mono text-[11px]">
            <div class="text-white/30 italic text-center py-10">Awaiting DNS traffic...</div>
        </div>
    </aside>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const map = L.map('map', {
        zoomControl: true,
        attributionControl: false
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
    }).addTo(map);

    const logDiv = document.getElementById("log");
    const liveIndicator = document.getElementById("live-indicator");

    // Stats State
    let stats = {
        total: 0,
        countries: new Set(),
        countryCounts: {},
        providers: {}
    };

    let domainFilter = "";
    let processedEvents = new Set();

    // Map Clustering & Tracking State
    let markers = [];
    let domainCounts = {};
    let locationMap = {};
    let coordCounts = {};

    function countryFlag(cc) {
        if (!cc || cc === 'UN' || cc.length !== 2) return '🏳️';
        return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
    }

    function collapseSidebar(id) {
        const sidebar = document.getElementById(id);
        if (!sidebar) return;
        // Using tailwind hidden utility for structural clean toggle
        sidebar.classList.toggle("hidden");
        setTimeout(() => map.invalidateSize(), 310); // Redraw map viewport after sidebar transitions
    }

    function updateStats() {
        document.getElementById("stat-total").textContent = stats.total;
        document.getElementById("stat-countries").textContent = stats.countries.size;

        renderProviderBars();
        renderCountryRanking();
    }

    function renderCountryRanking() {
        const container = document.getElementById("country-ranking-right");
        if (!container) return;

        const sorted = Object.entries(stats.countryCounts)
            .sort((a,b) => b[1] - a[1])
            .slice(0, 10);

        if (sorted.length === 0) return;

        container.innerHTML = "";
        sorted.forEach(([country, count]) => {
            const percentage = ((count / stats.total) * 100).toFixed(1);
            const item = document.createElement("div");
            item.className = "space-y-1";
            item.innerHTML = `
                <div class="flex justify-between text-[10px] font-bold uppercase tracking-wider">
                    <span class="text-white/70">${country}</span>
                    <span class="text-cyan-400">${percentage}%</span>
                </div>
                <div class="country-bar">
                    <div class="country-progress" style="width: ${percentage}%"></div>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function renderProviderBars() {
        const container = document.getElementById("provider-bars");
        container.innerHTML = "";

        const sorted = Object.entries(stats.providers).sort((a,b) => b[1] - a[1]).slice(0, 5);
        const max = Math.max(...Object.values(stats.providers), 1);

        sorted.forEach(([name, count]) => {
            const height = (count / max) * 100;
            const bar = document.createElement("div");
            bar.className = "flex-1 flex flex-col items-center gap-1 h-full justify-end";
            bar.innerHTML = `
                <div class="w-full bg-cyan-500/20 rounded-t relative group" style="height: ${height}%">
                    <div class="absolute inset-0 bg-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity rounded-t"></div>
                    <div class="absolute -top-4 left-0 right-0 text-[8px] text-center mono text-cyan-400">${count}</div>
                </div>
                <div class="text-[8px] uppercase truncate w-full text-center text-white/40 mt-1">${name.split(' ')[0]}</div>
            `;
            container.appendChild(bar);
        });
    }

    document.getElementById("filter-input").addEventListener("input", (e) => {
        domainFilter = e.target.value.toLowerCase();
        const entries = logDiv.querySelectorAll(".log-entry");
        entries.forEach(el => {
            const domain = el.getAttribute("data-domain");
            el.style.display = domain.includes(domainFilter) ? "block" : "none";
        });
    });

    function addLogEntry(data, markerIndex) {
        if (stats.total === 1) logDiv.innerHTML = "";

        const el = document.createElement("div");
        el.className = "log-entry p-2 bg-white/5 rounded-r hover:bg-white/10 transition-colors cursor-pointer";
        el.setAttribute("data-domain", data.domain.toLowerCase());
        el.setAttribute("data-marker-index", markerIndex);

        if (domainFilter && !data.domain.toLowerCase().includes(domainFilter)) {
            el.style.display = "none";
        }

        el.innerHTML = `
            <div class="flex justify-between items-start mb-1">
                <span class="text-cyan-400 font-bold truncate pr-2">${data.domain}</span>
                <span class="text-[9px] text-white/30">${new Date().toLocaleTimeString()}</span>
            </div>
            <div class="flex justify-between text-[9px] text-white/50 uppercase font-bold">
                <span>${countryFlag(data.country_code)} ${data.country_code || '??'} // ${data.provider_group || 'Unknown'}</span>
            </div>
        `;

        el.addEventListener("click", () => {
            highlightMarker(parseInt(el.getAttribute("data-marker-index")));
        });

        logDiv.prepend(el);
        if (logDiv.children.length > 50) logDiv.lastChild.remove();
    }

    function highlightMarker(index) {
        const marker = markers[index];
        if (!marker) return;
        const latlng = marker.getLatLng();
        map.setView(latlng, 6, { animate: true });
        marker.openPopup();
        marker.setStyle({ fillColor: '#22d3ee', color: '#ffffff', weight: 3 });
        setTimeout(() => marker.setStyle({ fillColor: '#22d3ee', color: '#ffffff', weight: 1 }), 2000);
    }

    function plotOnMap(data) {
        if (!data.lat || !data.lon) return;

        domainCounts[data.domain] = (domainCounts[data.domain] || 0) + 1;
        const count = domainCounts[data.domain];
        const key = data.domain;

        // If the marker exists, update size metrics and counter details
        if (locationMap[key]) {
            const entry = locationMap[key];
            entry.count = count;
            const r = 4 + Math.sqrt(count - 1) * 4;
            entry.marker.setRadius(Math.min(r, 30));
            entry.marker.setPopupContent(`
                <div class="mono text-[11px] p-1 text-slate-300">
                    <b class="text-cyan-400">${data.domain}</b><br>
                    IP: ${data.ip || 'N/A'}<br>
                    ASN: ${data.asn_owner || 'N/A'}<br>
                    LOC: ${countryFlag(data.country_code)} ${data.country || 'N/A'}${data.city ? ', ' + data.city : ''}<br>
                    <b>${count} request${count !== 1 ? 's' : ''}</b>
                </div>
            `);
            return entry.markerIndex;
        }

        const color = "#22d3ee";

        // Offset markers sharing identical lat/lon profiles
        const coordKey = data.lat.toFixed(2) + ',' + data.lon.toFixed(2);
        coordCounts[coordKey] = (coordCounts[coordKey] || 0) + 1;
        let placeLat = data.lat, placeLon = data.lon;
        if (coordCounts[coordKey] > 1) {
            const n = coordCounts[coordKey] - 1;
            const angle = (n * 137.5) * (Math.PI / 180);
            const dist = 0.005 + n * 0.0004;
            placeLat += Math.cos(angle) * dist;
            placeLon += Math.sin(angle) * dist;
        }

        const marker = L.circleMarker([placeLat, placeLon], {
            radius: 4,
            fillColor: color,
            color: "#fff",
            weight: 1,
            opacity: 0.8,
            fillOpacity: 0.8
        }).addTo(map);

        marker.bindPopup(`
            <div class="mono text-[11px] p-1 text-slate-300">
                <b class="text-cyan-400">${data.domain}</b><br>
                IP: ${data.ip || 'N/A'}<br>
                ASN: ${data.asn_owner || 'N/A'}<br>
                LOC: ${countryFlag(data.country_code)} ${data.country || 'N/A'}${data.city ? ', ' + data.city : ''}<br>
                <b>${count} request${count !== 1 ? 's' : ''}</b>
            </div>
        `);

        const markerIndex = markers.length;
        markers.push(marker);
        locationMap[key] = { marker, count: 1, markerIndex };

        // Pulse effect
        const pulse = L.circleMarker([placeLat, placeLon], {
            radius: 4,
            fillColor: color,
            color: color,
            weight: 2,
            opacity: 0.8,
            fillOpacity: 0
        }).addTo(map);

        let r = 4;
        const interval = setInterval(() => {
            r += 2;
            pulse.setRadius(r);
            pulse.setStyle({ opacity: 1 - (r/30) });
            if (r > 30) {
                clearInterval(interval);
                map.removeLayer(pulse);
            }
        }, 30);

        return markerIndex;
    }

    function handleNetworkEvent(event) {
        // Deduplicate incoming pipeline payloads using your dynamic entry unique-key check
        const eventKey = `${event.domain}-${event.ip}-${event.lat}-${event.lon}`;
        if (processedEvents.has(eventKey)) return;
        processedEvents.add(eventKey);

        stats.total++;
        const countryName = event.country || "Unknown";
        stats.countries.add(countryName);
        stats.countryCounts[countryName] = (stats.countryCounts[countryName] || 0) + 1;

        const pg = event.provider_group || "Unknown";
        stats.providers[pg] = (stats.providers[pg] || 0) + 1;

        updateStats();
        const mIdx = plotOnMap(event);
        addLogEntry(event, mIdx !== undefined ? mIdx : markers.length - 1);
    }

    async function fetchInitialData() {
        try {
            const response = await fetch('http://localhost:5000/fetch');
            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

            const data = await response.json();
            const historicalEvents = Array.isArray(data) ? data : [data];

            historicalEvents.forEach(event => handleNetworkEvent(event));
            console.log("INITIAL FETCH COMPLETE. BACKLOG SYNCED.");

            // Set indicator status after success
            liveIndicator.classList.remove("bg-red-500");
            liveIndicator.classList.add("bg-emerald-500");
        } catch (error) {
            console.error("INITIAL FETCH FAILED:", error);
        }
    }

    (async function startDashboard() {
        await fetchInitialData();
    })();
</script>
</body>
</html>
